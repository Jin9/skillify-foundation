services:
  postgres:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: inventory
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d

  inventory:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://postgres:mypassword@postgres:5432/inventory"
      KAFKA_ENABLED: "false"
      SWEEPER_CADENCE_SECONDS: "30"
      SWEEPER_BATCH_SIZE: "200"
      RESERVATION_TTL_MINUTES: "15"
      JWT_PUBLIC_KEY: "CHANGEME_BASE64_ENCODED_PUBLIC_KEY"
      JWT_ISSUER: "shoppilot-identity"
      JWT_AUDIENCE: "shoppilot-api"
      REF_ID_HEADER_KEY: "X-Ref-Id"
    depends_on:
      - postgres
