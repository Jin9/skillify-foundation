version: "3.9"

services:
  payment:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://payment:payment@postgres:5432/payment?sslmode=disable"
      KAFKA_ENABLED: "false"
      KAFKA_BROKERS: "kafka:9092"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      JWT_ISSUER: "shoppilot-identity"
      JWT_AUDIENCE: "shoppilot-api"
      CALLBACK_HMAC_SECRET: "${CALLBACK_HMAC_SECRET:-dev-hmac-secret}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:-dev-internal-secret}"
      INTENT_TTL_MINUTES: "15"
      SWEEPER_CADENCE_SECONDS: "60"
      SWEEPER_BATCH_SIZE: "200"
      PAYMENT_EMIT_EXPIRED_EVENT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5438:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payment_pgdata:
