services:
  checkout:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DSN: "postgres://checkout:checkout@postgres:5432/checkout?sslmode=disable"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      JWT_ISSUER: "shoppilot-identity"
      JWT_AUDIENCE: "shoppilot-api"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"
      # Downstream service URLs
      CART_BASE_URL: "http://cart:8080"
      CATALOG_BASE_URL: "http://catalog:8080"
      INVENTORY_BASE_URL: "http://inventory:8080"
      PAYMENT_BASE_URL: "http://payment:8080"
      ORDER_BASE_URL: "http://order:8080"
      IDENTITY_BASE_URL: "http://identity:8080"
    depends_on:
      - postgres
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    volumes:
      - checkout_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  checkout_postgres_data:
