version: "3.9"

services:
  cart:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      REF_ID_HEADER_KEY: X-Ref-ID
      ENV: LOCAL

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cart
      SECRET_DB_USERNAME: cart
      SECRET_DB_PASSWORD: cart_secret

      # JWT verification (ES256 public key — base64-encoded PEM)
      JWT_ISSUER: shoppilot-identity
      JWT_AUDIENCE: shoppilot-api
      SECRET_JWT_PUBLIC_KEY: "${SECRET_JWT_PUBLIC_KEY}"

      # Upstream services
      CATALOG_BASE_URL: "http://catalog:8082"
      INVENTORY_BASE_URL: "http://inventory:8083"

      # Fan-out tuning
      FANOUT_TIMEOUT_MS: "3000"
      FANOUT_MAX_ITEMS: "50"
      FANOUT_CONCURRENCY: "10"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart_secret
      POSTGRES_DB: cart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
