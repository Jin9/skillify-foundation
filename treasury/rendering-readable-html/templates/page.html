<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    /* Self-contained, system fonts only. No web fonts, no @import, no url(http...). */
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #5b6470;
      --bg: #ffffff;
      --accent: #1a4f8b;
      --border: #d8dde3;
      --row-alt: #f6f8fa;
      --code-bg: #f2f4f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e7ebf0;
        --muted: #9aa4b2;
        --bg: #14171c;
        --accent: #74a7e0;
        --border: #2c333d;
        --row-alt: #1b1f26;
        --code-bg: #1b1f26;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 70ch; margin: 0 auto; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 1.8rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.3rem; margin: 2rem 0 .5rem; border-bottom: 1px solid var(--border); padding-bottom: .25rem; }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 .35rem; }
    p, li { margin: .5rem 0; }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .meta { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: .9em;
    }
    code { background: var(--code-bg); padding: .1rem .35rem; border-radius: 4px; }
    pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: .95rem;
    }
    caption { caption-side: top; text-align: left; color: var(--muted); padding-bottom: .5rem; }
    th, td { text-align: left; padding: .5rem .65rem; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    dl.summary { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
    dl.summary dt { color: var(--muted); }
    dl.summary dd { margin: 0; }
    section.card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1rem 0;
    }
    .table-wrap { overflow-x: auto; }
    @media print {
      body { padding: 0; color: #000; background: #fff; }
      a { color: #000; text-decoration: underline; }
      h2 { border-color: #000; }
      tbody tr:nth-child(even) { background: #eee; }
      section.card { border-color: #000; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{HEADING}}</h1>
    <!-- Optional one-line provenance; delete this <p> if not used. -->
    <p class="meta">{{META}}</p>

    <!-- {{CONTENT}}: replace with semantic HTML built per references/layout-patterns.md.
         Every interpolated value MUST already be HTML-escaped. -->
    {{CONTENT}}
  </main>
</body>
</html>
